# 開発コマンドの実行環境。詳細は doc/guidelines/development-command-guidelines.md を参照する。
services:
  dev:
    # rust 公式 image を base に、rustfmt と clippy を足した image を使う。
    build:
      context: .
      target: dev
    image: bizdate-dev:1.98
    working_dir: /work
    environment:
      # host の TZ を引き継ぐ。判定結果が「今日」の解釈に依存するため
      # (doc/design/business-day.md)。host 側が未設定なら container は UTC になる。
      - TZ
      - BIZDATE_TZ
    volumes:
      - .:/work
      # registry と target を named volume に保持し、再ビルドの時間を短縮する。
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/work/target
    # 単発の cargo 実行を `docker compose run --rm dev ...` で行うための待機用。
    command: ["sleep", "infinity"]

  # 配布成果物の生成と確認 (dist / cargo-about) に使う。dev image に 2 つの tool を足しただけで、
  # toolchain と volume は dev と共有する。`docker compose run --rm release-tools ...` で使う。
  # profile を付け、dev だけを扱う操作 (cloud session の hook など) の対象に入れない。
  release-tools:
    build:
      context: .
      target: release-tools
    image: bizdate-release-tools:1.98
    profiles: ["release-tools"]
    working_dir: /work
    environment:
      - TZ
      - BIZDATE_TZ
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target:/work/target
    command: ["sleep", "infinity"]

volumes:
  cargo-registry:
  cargo-git:
  target:
