version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # 更新を 1 本にまとめ、直列にレビューする。
    # 方針は doc/design/decision-log/0015-dependabot-updates.md を参照。
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
