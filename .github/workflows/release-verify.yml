# Release workflow (.github/workflows/release.yml。dist が生成する) が、build の後、host の前に呼ぶ
# reusable workflow。dist-workspace.toml の global-artifacts-jobs から参照する。host (GitHub Release の
# 作成) は、この workflow の job がすべて成功したときだけ走る。PR でも同じ検証を行うが、公開はしない。
# 構成と採否理由は doc/design/decision-log/0022-release-workflow.md を参照する。
# 検証のほかに 1 つだけ、host が Release に上げる build の workflow artifact を変える。dist が作る
# checksum file の末尾の空行を取り除く (checksum-normalize。0022 の 2026-09-25 追記)。
name: Release verify

on:
  workflow_call:
    inputs:
      plan:
        description: dist の plan (dist-manifest.json)。archive 名と構成、build の matrix を読む
        required: true
        type: string

permissions:
  contents: read

jobs:
  # 公開 trigger の tag が v<Cargo.toml の version> の形であることを確かめる。
  # version の不一致は plan job の dist も検出するが、tag の形 (v の有無など) は dist が許すため、ここで絞る。
  # PR 以外では常に検査する (fail-closed)。dist の trigger 設定 (dispatch-releases / release-branch) を
  # 変えて tag の push 以外で公開が走る構成になっても、tag でない ref では失敗させて host を止める。
  tag:
    name: release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # 第三者 action は commit SHA で固定する。末尾のコメントは固定時点の tag を示す。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the release tag
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/check-release-tag.sh "$TAG"

      - name: Note that this run does not publish
        if: github.event_name == 'pull_request'
        run: |
          echo "pull request run: the archives are verified but not published"

  # build した archive を、build と同じ native runner で展開して検証する。matrix は dist の plan から取り、
  # build-local-artifacts と同じ target と runner の組にする。
  archive:
    name: archive (${{ join(matrix.targets, ', ') }})
    strategy:
      # 1 つの target が落ちても、残りの target の結果を揃える。
      fail-fast: false
      matrix: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-local-artifacts が upload した、この runner の archive と checksum を取る。
      # 公開済みの Release asset ではなく、この run の workflow artifact を検証する。
      - name: Fetch the archive built on this runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: ${{ runner.temp }}/distrib

      # checksum、archive 名と構成 (plan と照合)、同梱物、展開した binary の起動と実行時前提を確かめ、
      # 結果を step summary に記録する。
      - name: Verify the archive
        env:
          PLAN: ${{ inputs.plan }}
          TARGETS: ${{ join(matrix.targets, ' ') }}
        run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          for target in $TARGETS; do
            .github/scripts/verify-release-archive.sh "$target" "$RUNNER_TEMP/distrib" "$RUNNER_TEMP/plan.json"
          done

  # Homebrew Formula を生成して検査し、起動テストを足して brew style の自動修正をかける。
  # ここで作って homebrew job が install と brew test を通した Formula を、tag push の publish-homebrew が
  # そのまま tap へ書く。
  # この workflow は build-global-artifacts (Formula を作る job) と並行して走り、その artifact を待てないため、
  # plan job が保存した同じ dist で、同じ入力 (全 target の archive と checksum) から Formula を作り直す。
  # 名前を artifacts-* にしない。host は artifacts-* を Release へ添付するため。
  # prerelease では job ごと skipped にする (homebrew も needs で skipped)。Formula は prerelease を扱わず
  # tap も更新しないが、GitHub Release の公開 (host) は止めない。reusable workflow 内の skipped は host の
  # 条件で成功扱いになる。
  homebrew-formula:
    name: homebrew formula
    # 一時的な確認用 (PR #89 の review): prerelease の経路を PR の run で通すため条件を反転している。後の commit で戻す。
    if: ${{ fromJson(inputs.plan).announcement_is_prerelease }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-cache
          path: ${{ runner.temp }}/dist-bin

      - name: Fetch the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true

      - name: Generate and prepare the Formula
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          chmod +x "$RUNNER_TEMP/dist-bin/dist"
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          tag=$(jq --raw-output .announcement_tag "$RUNNER_TEMP/plan.json")
          "$RUNNER_TEMP/dist-bin/dist" build --tag="$tag" --artifacts=global --output-format=json > "$RUNNER_TEMP/global.json"
          mkdir "$RUNNER_TEMP/formula"
          .github/scripts/prepare-homebrew-formula.sh target/distrib/bizdate.rb target/distrib \
            "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/formula/bizdate.rb"

      # dist の template が含む、brew style の自動修正できる違反を直す (publish-homebrew はこの結果をそのまま書く)。
      - name: Fix the Formula style
        run: .github/scripts/fix-homebrew-formula-style.sh "$RUNNER_TEMP/formula/bizdate.rb"

      - name: Upload the Formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verify-homebrew-formula
          path: ${{ runner.temp }}/formula/bizdate.rb
          if-no-files-found: error

  # 検査した Formula の url をこの run の archive へ差し替えて、build と同じ native runner で install と
  # brew test を行う。公開 tap からの brew install / upgrade の確認ではない。
  homebrew:
    name: homebrew (${{ join(matrix.targets, ', ') }})
    needs: homebrew-formula
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the Formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verify-homebrew-formula
          path: ${{ runner.temp }}/formula

      - name: Fetch the archive built on this runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: ${{ runner.temp }}/distrib

      # macOS の runner は brew が PATH にある。Ubuntu の runner (x86_64 / arm64) は /home/linuxbrew に
      # 入っているが PATH に無い。brew が見つからなければ verify-homebrew-formula.sh が失敗する。
      - name: Install and test the Formula
        env:
          TARGETS: ${{ join(matrix.targets, ' ') }}
        run: |
          if ! command -v brew > /dev/null 2>&1 && [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          for target in $TARGETS; do
            .github/scripts/verify-homebrew-formula.sh "$target" "$RUNNER_TEMP/formula/bizdate.rb" "$RUNNER_TEMP/distrib"
          done

  # dist 0.32.0 の checksum file (archive ごとの .sha256 と sha256.sum) は末尾に空行を含み、macOS の
  # shasum -a 256 -c が警告を出す。host が Release に上げる前に、build の workflow artifact を、空行を
  # 取り除いた checksum file の入ったものに置き換え、host と同じ形で検査する (0022 の 2026-09-25 追記)。
  # sha256.sum を作る build-global-artifacts は、この workflow と並行して走り needs で待てないため、
  # この run の artifact の一覧を読んで待つ (actions: read が要る)。置き換えは、この workflow で build の
  # artifact を取得する job (archive、homebrew-formula、homebrew) がすべて終わってから行う。
  # prerelease で homebrew-formula と homebrew が skipped でも、この job と後の 2 job を走らせる。後の 2 job
  # にも状態関数を含む if を置く。if が無い job は暗黙の success() で評価され、依存の連鎖の上流に skipped が
  # あると skipped になる。reusable workflow の中の skipped は host の条件で成功扱いになるため、置き換えも
  # 検査もせずに host が公開してしまう。
  checksum-artifacts:
    name: wait for build artifacts
    needs: [archive, homebrew-formula, homebrew]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      names: ${{ steps.wait.outputs.names }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-global-artifacts の artifact が上がるのを待ち、checksum file を含む build の artifact の名前を出す。
      - name: Wait for the build artifacts
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-build-artifacts.sh 900 >> "$GITHUB_OUTPUT"

  # build の artifact ごとに、checksum file の末尾の空行を取り除き、同じ名前で置き換える (overwrite)。
  # host は置き換えた artifact を Release に上げる。空行の無い file (dist が直った場合) は変えない。
  checksum-normalize:
    name: normalize checksums (${{ matrix.name }})
    needs: checksum-artifacts
    if: ${{ !cancelled() && needs.checksum-artifacts.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.checksum-artifacts.outputs.names) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ runner.temp }}/artifact

      - name: Remove the trailing empty line from the checksum files
        run: .github/scripts/normalize-checksum-files.sh "$RUNNER_TEMP/artifact"

      - name: Replace the build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ runner.temp }}/artifact/
          if-no-files-found: error
          overwrite: true

  # host と同じ形 (artifacts-* を 1 つの dir にまとめる) で取得し、Release に上がる checksum file を検査する。
  # 空行が残っていれば、ここで失敗して host を止める。
  checksum:
    name: checksum files
    needs: checksum-normalize
    if: ${{ !cancelled() && needs.checksum-normalize.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the artifacts as host does
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: ${{ runner.temp }}/distrib
          merge-multiple: true

      - name: Check the checksum files
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          .github/scripts/check-checksum-files.sh "$RUNNER_TEMP/distrib" "$RUNNER_TEMP/plan.json"
