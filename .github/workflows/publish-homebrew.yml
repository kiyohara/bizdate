# Release workflow (.github/workflows/release.yml。dist が生成する) が、host (GitHub Release の公開) の後に
# 呼ぶ reusable workflow。dist-workspace.toml の publish-jobs から参照する。tag push でだけ走り、PR では
# host が走らないため呼ばれない。prerelease では、dist が生成する呼び出し側の条件で skipped になる。
# dist の builtin の Homebrew publish job を使わない理由は doc/design/decision-log/0025-homebrew-formula-publishing.md。
#
# tap (kiyohara/homebrew-tap) への push には、このリポジトリの secret HOMEBREW_TAP_GITHUB_TOKEN を使う。
# 名前は同じ tap へ書く slapex と揃えている (dist の builtin の job が読む HOMEBREW_TAP_TOKEN ではない)。
# 設定はユーザーが行う (doc/design/distribution.md の「Homebrew」)。
name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      plan:
        description: dist の plan (dist-manifest.json)。Formula の version を照合する
        required: true
        type: string

permissions:
  contents: read

jobs:
  formula:
    name: formula
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # release-verify が同じ run で作り、3 つの native runner で install と brew test を通した Formula を
      # そのまま書く。作り直さないため、検証した内容と書く内容が一致し、この job を再実行しても内容は変わらない。
      - name: Fetch the verified Formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verify-homebrew-formula
          path: ${{ runner.temp }}/formula

      - name: Check the Formula version against the plan
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          want=$(printf '%s' "$PLAN" | jq --raw-output '.releases[] | select(.app_name == "bizdate") | .app_version')
          have=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$RUNNER_TEMP/formula/bizdate.rb")
          if [ -z "$want" ] || [ "$have" != "$want" ]; then
            echo "::error::the verified Formula has version '$have', not '$want' from the plan"
            exit 1
          fi
          echo "ok: bizdate $have"

      - name: Check that the tap token is set
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "::error::the secret HOMEBREW_TAP_GITHUB_TOKEN is not set; set it and re-run this job (the GitHub Release is already published)"
            exit 1
          fi

      # push するため、この checkout だけ credential を残す。
      - name: Checkout the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kiyohara/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap
          persist-credentials: true

      # 巻き戻し、同じ version の作り直し、Formula/bizdate.rb 以外の変更では止まる。同じ内容が既にあれば
      # 何もしない (push 済みの後にこの job を再実行した場合)。
      - name: Publish the Formula
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: .github/scripts/publish-homebrew-formula.sh "$RUNNER_TEMP/formula/bizdate.rb" homebrew-tap
