[package]
name = "bizdate"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "その日が月の最初 / 最後の業務日かどうかを判定する CLI"
license = "MIT"
repository = "https://github.com/kiyohara/bizdate"
homepage = "https://github.com/kiyohara/bizdate"
# 公開ライブラリクレートとしては提供しない (doc/design/decision-log/0008-language-and-distribution.md)。
publish = false

# publish = false の package を dist は既定で配布対象から外す。bin を配るため package 単位で上書きする
# (doc/design/distribution.md)。dist の他の設定は dist-workspace.toml に置く。
[package.metadata.dist]
dist = true

[[bin]]
name = "bizdate"
path = "src/main.rs"

# 選定理由は doc/design/decision-log/0014-dependency-crates-and-toolchain.md を参照する。
[dependencies]
clap = { version = "4.6", features = ["derive"] }
jiff = "0.2"
csv = "1.4"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
encoding_rs = "0.8"

# dist が配布 archive をビルドする profile。release と同じ設定にし、CI の platform job が
# --release で E2E を通したものと同じ最適化の binary を配る (doc/design/decision-log/0022-release-workflow.md)。
[profile.dist]
inherits = "release"
